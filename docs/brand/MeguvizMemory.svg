<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 72 72" role="img" aria-labelledby="title desc"><title id="title">MeguvizMemory</title><desc id="desc">两条相向回折的内存银行共同组成紧凑方形轮廓：深紫表示持有的内存域，珊瑚表示租借与回流域。连续定宽带、等距层间留白和相切圆弧形成稳定节奏，以横向分配结构区分解包项目的核心与壳体。</desc><g transform="translate(2.59631 3.16717) scale(1.04831)"><path fill="#4B3F63" d="M50 10A3 3 0 0 1 50 16H20A4 4 0 0 0 20 24H44A3 3 0 0 1 44 30H20A10 10 0 0 1 20 10H50Z"/><path fill="#EF927A" d="M14 54A3 3 0 0 1 14 48H44A4 4 0 0 0 44 40H20A3 3 0 0 1 20 34H44A10 10 0 0 1 44 54H14Z"/></g></svg>